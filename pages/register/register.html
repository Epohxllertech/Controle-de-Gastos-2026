<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO DO CONTROLE DE GASTOS</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="../../index.css"> 
</head>
<body class="centralize">
    <div class="home"><h4>Bem-vindo ao Registro do Controle de Gastos!</h4></div>
    
    <div id="content" style="text-align: center; margin-bottom: 20px;">
        <p class="pBody03">Registre-se para ter acesso a todas as funcionalidades do nosso sistema comece a organizar suas finanças hoje mesmo!</p>
        <p class="pBody03">Preencha os dados abaixo para criar sua conta.</p>
    </div>

    <form id="register-form">
        <div class="form-field">
            <label for="reg-nome">Nome:</label>
            <input type="text" id="reg-nome" placeholder="Digite seu nome completo">
        </div>

        <div class="form-field">
            <label for="reg-email">E-mail:</label>
            <input type="email" id="reg-email" placeholder="Digite seu melhor e-mail" onchange="onChangeEmail()">
        </div>

        <div class="form-field">
            <label for="reg-password">Senha:</label>
            <input type="password" id="reg-password" placeholder="Crie uma senha">
        </div>

        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
            <button type="button" class="classEntrar" onclick="handleRegister()">Criar Conta</button>
            <button type="button" class="classRecuperar" onclick="goBack()">Voltar</button>
        </div>
    </form>

    <!-- 1º: SDKs do Firebase (ORDEM OBRIGATÓRIA) -->
    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore-compat.js"></script>

    <!-- 2º: Configuração do Firebase -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCuJVEvq8QgeqONgQXF54-TVfQuAd8HsCQ",
            authDomain: "controle-de-gastos-1f442.firebaseapp.com",
            projectId: "controle-de-gastos-1f442",
            storageBucket: "controle-de-gastos-1f442.firebasestorage.app",
            messagingSenderId: "555510424243",
            appId: "1:555510424243:web:46af1abed54bd9646486c6"
        };
        firebase.initializeApp(firebaseConfig);
    </script>

    <!-- 3º: O arquivo JS que contém TODA a lógica (Caminho corrigido para /) -->
    <!-- Se o register.js estiver na mesma pasta que este HTML, use apenas "register.js" -->
    <script src="register.js"></script>

    <footer style="margin-top: 20px;"> 
        <p>* SISTEMA PARA CONTROLE DE GASTOS - FLUIVERT 2026 - TODOS OS DIREITOS RESERVADOS * </p>
    </footer>
</body>
</html>
