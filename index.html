<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN DE CONTROLE DE GASTOS</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="global.css">
</head>
<body class = "centralize">
    <form>
        <div class="form-field">
            <div><label for="nome">Nome:</label></div>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
        </div>
        <div class="form-field">
            <div><label for="email">E-mail:</label></div>
            <input type="email" name="email" id="email" oninput="validateFields()" placeholder="Digite seu email">
            <div class="error" id="email-invalid-error" style="display:none">Email inválido</div>
            <div class="error" id="email-required-error" style="display:none">Email obrigatório</div>
        </div>
        <div class="form-field">
            <div><label for="password">Senha:</label></div>
            <input type="password" name="password" id="password" oninput="validateFields()" placeholder="Digite sua senha">
            <div class="error" id="password-required-error" style="display:none">Senha obrigatória</div>
        </div>
        <div>
            <button type="button" class="classRecuperar" id="recuperarSenha" disabled>Recuperar Senha</button>
        </div>
        <div>
            <button type="button" class="classEntrar" id="login-button" disabled onclick="login()">Entrar</button>
        </div>
        <div>
            <button type="button" class="classRegistrar" id="registrar" onclick="register()">Registrar</button>
        </div>
    </form>

    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>

            apiKey: "AIzaSyCuJVEvq8QgeqONgQXF54-TVfQuAd8HsCQ",

            storageBucket: "controle-de-gastos-1f442.firebasestorage.app",
            messagingSenderId: "555510424243",
            appId: "1:555510424243:web:46af1abed54bd9646486c6"
        };
        firebase.initializeApp(firebaseConfig);
    </script>
    <script src="index.js"></script>
    <script src="validations.js"></script>
    <script src="loading.js"></script>
</body>
