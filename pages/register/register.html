<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO DO CONTROLE DE GASTOS</title>
    <link rel="stylesheet" href="../../global.css">
</head>
<body>
    <h1 class="home">Bem-vindo ao Registro do Controle de Gastos</h1>
    <div id="content" style="text-align: center;">
        <p class="pBody03">Registre-se para ter acesso a todas as funcionalidades do nosso sistema e comece a organizar suas finanças hoje mesmo!</p>
        <p class="pBody03">Preencha os dados nos campos a baixo para criar sua conta.</p>
        
        <button type="button" class="classRecuperar" onclick="logout()">Sair</button>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCuJVEvq8QgeqONgQXF54-TVfQuAd8HsCQ",
            authDomain: "controle-de-gastos-1f442.firebaseapp.com",
            projectId: "controle-de-gastos-1f442",
            storageBucket: "controle-de-gastos-1f442.firebasestorage.app",
            messagingSenderId: "555510424243",
            appId: "1:555510424243:web:46af1abed54bd9646486c6"
        };
        firebase.initializeApp(firebaseConfig);

        // Removido o redirecionamento automático para permitir que novos usuários 
        // acessem esta página e criem suas contas.
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                console.log("Usuário logado acessando registro:", user.email);
            }
        });

        function logout() {
            firebase.auth().signOut().then(() => {
                window.location.href = "../../index.html";
            });
        }
    </script>
</body>
</html>
